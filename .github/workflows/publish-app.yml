name: Publish Curtis BCH App Image
on:
  push:
    branches: [main]
    paths:
      - "curtis-bch/web/**"
      - ".github/workflows/publish-app.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./curtis-bch/web
          push: true
          tags: |
            ghcr.io/soggyhammydev/curtis-bch-app:0.1.0
            ghcr.io/soggyhammydev/curtis-bch-app:latest
          platforms: linux/amd64
