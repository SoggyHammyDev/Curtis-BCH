name: Publish Curtis BCH App Image

on:
  push:
    branches: [main]
    paths:
      - "curtis-bch/web/**"
      - ".github/workflows/publish-app.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Curtis BCH
        uses: docker/build-push-action@v6
        with:
          context: ./curtis-bch/web
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/akacurtis/curtis-bch-app:0.1.0
            ghcr.io/akacurtis/curtis-bch-app:latest
