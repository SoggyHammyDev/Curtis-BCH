name: Publish Curtis BCH Images
on:
  push:
    branches: [main]
    paths:
      - "curtis-bch/web/**"
      - "curtis-bch/bchn/**"
      - "curtis-bch/ckpool/**"
      - ".github/workflows/publish-app.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: app
            context: ./curtis-bch/web
            image: curtis-bch-app
          - name: bchn
            context: ./curtis-bch/bchn
            image: curtis-bch-bchn
          - name: ckpool
            context: ./curtis-bch/ckpool
            image: curtis-bch-ckpool
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/soggyhammydev/${{ matrix.image }}:0.1.9
            ghcr.io/soggyhammydev/${{ matrix.image }}:latest
